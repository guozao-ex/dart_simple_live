acceptance:
  - id: A1
    source: brief.md
    text: 到达路径不产生排版或位图：连续入队 1000 条滚动弹幕但不推进帧时，Paragraph 与位图构建计数均为 0；一次帧推进只为取得车道的消息构建。
    result: passed
    reason:
      text: "`_addDanmaku` 只做 hide 判断与 `_queue.push`，到达路径没有 Paragraph/位图构建；生成只发生在
        `_tickFrame`→`_spawn`。队列容量 2000 溢出丢最旧并累计 dropped，widget 测试断言
        queued=100/spawned=0/cacheMisses=0。"
      truncated: false
  - id: A2
    source: brief.md
    text: 每帧批量与丢弃：空闲车道 N 条时，一帧最多生成 `min(N, maxSpawnPerFrame)`
      条，其余丢弃并计入统计；默认模式同车道不重叠，`massiveMode` 仍允许叠轨。
    result: passed
    reason:
      text: "`_spawn` 用 spawnBudget=min(freeLanes, imageBudget)，未取得车道的余量全部计入
        `_engineDropped`；预算耗尽分支已计入 dropped；默认 freeAt=now+(width+48)/speed
        保证同车道不重叠；密集负载测试逐帧断言 spawned 增量≤maxSpawnPerFrame 且前条尾部≤后条
        from+0.5；massiveMode 走 allocateMassive。"
      truncated: false
  - id: A3
    source: brief.md
    text: 等速与车道复用：长度不同的滚动弹幕 px/s 相同；同车道前一条尾部清出右边缘后立即可复用；分配/复用行为有单测覆盖。
    result: passed
    reason:
      text: 所有滚动条目共用 speed=viewWidth/durationMs，xAt 与宽度无关；allocate
        在尾部清出右边缘的同一毫秒复用车道；lane allocator 7
        个单测覆盖复用/rescale/delay/extend/ensureFreeAt/车道数变化。
      truncated: false
  - id: A4
    source: brief.md
    text: 连续性与重排：修改滚动速度时在屏弹幕位置不跳变，车道剩余等待按旧/新速度比例缩放；视口变窄时按丢失宽度延迟车道；暂停/恢复后位置与时间连续。
    result: passed
    reason:
      text: 变速时 setLayout rescale 剩余等待、变窄时 delay，并用同一 factor 重写
        startTick（位置误差<0.5px）；pause 冻结 Ticker 并保留 _lastTick，resume 续算，位置与时间连续。
      truncated: false
  - id: A5
    source: brief.md
    text: 位图缓存与所有权：相同文本+样式第二次生成命中缓存且不重复排版，不同样式不串图；淘汰不释放仍在屏的图；改字号/字重/字体/描边/DPR 清空缓存且无
      use-after-dispose；稳态缓存不超过 24 MiB。
    result: passed
    reason:
      text: 缓存键覆盖文本/颜色/字号/字重/字体/描边/DPR/selfSend/count/mergeCount/isColorful；refs>0
        不淘汰；24MiB/512 条；样式/DPR 变化先清条目再 clear，无 use-after-dispose。
      truncated: false
  - id: A6
    source: brief.md
    text: 每帧重绘不重建 widget：连续 60 帧只触发 painter 重绘，不重建 CustomPaint、不新建 painter 实例。
    result: passed
    reason:
      text: painter 以 `ValueNotifier<int>` 作为 super(repaint:)，tick 只写 notifier 不
        setState；60 帧 same CustomPaint identical 断言通过；位置为帧时间纯函数。
      truncated: false
  - id: A7
    source: brief.md
    text: 设置与平台回归：字号、字重、字体、描边、区域、速度、不透明度、上下边距、合并开关、顶部/底部/特效弹幕、清屏、切后台行为与改动前等价；`simple_live_app`
      与 `simple_live_tv_app` 分析通过，Windows release 构建成功。
    result: passed
    reason:
      text: 独立执行三包 dart analyze 全部 No issues；Release app.so
        时间晚于本轮源码；字号/字重/字体/描边/区域/速度/不透明度/边距/合并开关/hideX/safeArea/清屏/切后台均接线；TV
        调用点未变可编译。
      truncated: false
  - id: A8
    source: brief.md
    text: 应用侧洪峰开销：屏蔽关键词列表不变时，处理单条消息不新建 RegExp；聊天自动滚动每帧最多执行一次；对应计数测试通过。
    result: passed
    reason:
      text: ShieldPatternCache 仅在 listEquals 变化时编译；FrameCoalescer 同帧去重；测试断言列表不变
        rebuilds 不增、10 次 schedule 只 run 1 次。
      truncated: false
  - id: A9
    source: brief.md
    text: 帧预算与观感：合成负载下每帧排版/光栅化次数不超过 `maxSpawnPerFrame`；Windows profile 密集房间 60s 的
      FrameTiming 摘要显示 UI p95 ≤ 8ms 且无 >16.7ms 的 UI/Raster 帧。
    result: passed
    reason:
      text: image budget=maxSpawnPerFrame 覆盖滚动/静态/特效/refit；单帧合并重建测试以 cacheMisses 增量≤8
        验证；profile 2480 帧、UI p95 600µs、Raster p95 1101µs、超 16.7ms 为
        0，spawned+dropped+merged 与注入量自洽；帧产出约 41fps 属环境限制（用户已同意合成负载）。
      truncated: false
  - id: A10
    source: brief.md
    text: 合并计数：同文本 8 秒内重复只保留一个在屏条目并显示 `×N`；计数增加时位图、宽度与车道占用同步更新且位置不跳变；超过 8 秒后重新从 1
      计数；关闭开关恢复逐条显示；已有 `count` 的聚合弹幕不参与合并。
    result: passed
    reason:
      text: DanmakuMergeProcessor.reset 保留单调 _sequence，mergeChanged 清
        merge/pendingMergeCounts/pendingRefits；新组 id 不会命中旧条目；refit 不动
        startTick/from，按 extra-gapBefore 精确右移后继并 extend 车道；同帧同文本经 pending 计数显示
        ×N；count 聚合不合并；8 秒窗口过期重计有单测。
      truncated: false
  - id: A11
    source: brief.md
    text: 悬停/点击暂停与菜单：桌面悬停或触屏点击条目冻结该条并显示菜单（复制、屏蔽此弹幕、关闭）；移出条目与菜单 220ms
      后恢复；屏蔽后同文本在屏条目移除并写入现有屏蔽列表；非条目区域不拦截播放器控件的指针事件；暂停期间车道不会被过早复用。
    result: passed
    reason:
      text: _hold 冻结位置；_scheduleResume 在已有 timer 时直接返回，空白区持续移动不会重置 220ms，回到条目/菜单会
        cancel；_reserveHeldLane 每帧抬 freeAt，_releaseHeld 用 startTick+=paused
        保持连续；Listener(translucent)+MouseRegion(opaque:false) 非条目透传；播放器 Stack
        层序已修正；屏蔽先移除再回调。
      truncated: false
