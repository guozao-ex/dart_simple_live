ll,"specChanges":[{"capability":"danmaku-scroll-engine","operation":"create","source":"specs/danmaku-scroll-engine/spec.md"}]},{"addressedAcceptanceIds":["A1","A2","A3","A4","A5","A6","A7","A8","A9","A10","A11"],"checks":[{"name":"canvas_danmaku analyze","note":"flutter analyze: No issues found.","result":"passed"},{"name":"canvas_danmaku test","note":"flutter test: 31 tests passed (allocator/queue/cache/merge/screen, including 600-frame synthetic load).","result":"passed"},{"name":"simple_live_app analyze lib","note":"flutter analyze lib: No issues found.","result":"passed"},{"name":"simple_live_app focused tests","note":"frame_coalescer_test + shield_pattern_cache_test: 3 tests passed.","result":"passed"},{"name":"simple_live_tv_app analyze lib","note":"flutter analyze lib: No issues found.","result":"passed"},{"name":"simple_live_app build windows --release","note":"Built build/windows/x64/runner/Release/simple_live_app.exe in 311.2s after enabling Developer Mode and placing nuget.exe on PATH.","result":"passed"},{"name":"synthetic dense-load profile","note":"60s at ~36 msg/s: 3318 frames, UI p95 702us, Raster p95 1579us, 0 UI/Raster frames >16.7ms; spawned 544, dropped 1281, merged 356; report at D:/DEV/_research/danmaku_profile.json.","result":"passed"}],"knownLimits":["Windows release build required Developer Mode for plugin symlinks and nuget.exe for flutter_inappwebview_windows; both are local environment prerequisites, not repo changes.","A9 profile uses the user-approved synthetic dense load (~36 msg/s, 60s) instead of a real live room; the harness is outside the repo at D:/DEV/_research/danmaku_bench.","The synthetic profile has cacheHits=0 because all generated texts are unique except '666', which is merged instead of spawning a new image; cache hit behavior is covered by the package cache/screen tests.","No manual visual confirmation on a real live stream was performed; interaction and layout behavior are covered by widget tests."],"requireIndependentReview":false,"summary":"复刻 Fy1Sync 横向弹幕引擎并接入合并计数与暂停菜单：新增到达队列、每帧批量 spawn、等速 px/s 车道（freeAt）、溢出丢弃、文本位图 LRU（引用计数）、repaint listenable 与设备像素吸附；同文本 8 秒内合并为 ×N 并 refit 位图/宽度/车道；悬停或点击冻结单条并显示复制、屏蔽此弹幕、关闭菜单；应用侧预编译屏蔽正则、聊天滚动每帧合并、合并开关持久化与屏蔽回调。验证：包内 31 个测试、App 3 个定向测试、三个包 analyze 通过、Windows release 构建成功、合成密集负载 60 秒 profile UI p95 702µs / Raster p95 1579µs 且 0 帧超过 16.7ms。"},{"candidateId":"danmaku-scroll-engine:7","checks":[{"name":"canvas_danmaku analyze","note":"flutter analyze: No issues found.","result":"passed"},{"name":"canvas_danmaku test","note":"flutter test: 31 tests passed (allocator/queue/cache/merge/screen, including 600-frame synthetic load).","result":"passed"},{"name":"simple_live_app analyze lib","note":"flutter analyze lib: No issues found.","result":"passed"},{"name":"simple_live_app focused tests","note":"frame_coalescer_test + shield_pattern_cache_test: 3 tests passed.","result":"passed"},{"name":"simple_live_tv_app analyze lib","note":"flutter analyze lib: No issues found.","result":"passed"},{"name":"simple_live_app build windows --release","note":"Built build/windows/x64/runner/Release/simple_live_app.exe in 311.2s after enabling Developer Mode and placing nuget.exe on PATH.","result":"passed"},{"name":"synthetic dense-load profile","note":"60s at ~36 msg/s: 3318 frames, UI p95 702us, Raster p95 1579us, 0 UI/Raster frames >16.7ms; spawned 544, dropped 1281, merged 356; report at D:/DEV/_research/danmaku_profile.json.","result":"passed"}],"response":{"kind":"final-result","result":{"acceptance":[{"id":"A1","reason":"danmaku_screen.dart 的 `_addDanmaku` 只做 hide* 过滤与 `_queue.push`（容量 2000，溢出丢最旧），Paragraph/位图只可能在 `_tickFrame`→`_spawn`→`_spawnScroll/_spawnStatic` 中构造。`_spawn` 预算为 min(freeLanes,maxSpawnPerFrame)，非 massive 路径 take≤free，逐条 allocate 必成功；massive 路径 allocateMassive 恒成功，因此不存在先排版再因无车道丢弃的额外构建；到达路径也不查车道。包内测试「到达只入队，一帧按上限批量生成，其余丢弃」通过且 stats 的 queued=100/spawned=0/cacheMisses=0 与实现一致，1000 条同理。","result":"passed"},{"id":"A2","reason":"`_spawn` 用 min(freeLanes,maxSpawnPerFrame) 限制单帧生成，未取得车道的 ready 计入 `_engineDropped`；allocate 以 freeAt=now+width/speed 做零间隙复用，默认模式同车道不会同时进入两条；massiveMode 且 freeLanes==0 时走 allocateMassive 随机叠轨。测试「合成密集负载」逐帧断言 spawned≤maxSpawnPerFrame 且同车道前一条尾部不超过后一条 from，已通过。限制：massiveMode 只有代码路径没有测试；另 spec 的「selfSend 保留优先叠轨语义」在重写后丢失（旧实现在无空轨时把 selfSend 强制放进 0 号轨，新实现按普通消息丢弃），当前两个 App 都未使用 selfSend，影响尚未暴露。","result":"passed"},{"id":"A3","reason":"速度统一为 viewWidth/durationMs，所有滚动条目共享 `_lanes.layout.speed`，两条长度不同的条目在同一时间位移相同；allocate 的 freeAt=now+width/speed 使前一条尾部清出右边缘的同一时刻即可复用（单测在 1499ms 仍是 4 条空闲、1500ms 起 lane 0 可再分配）。danmaku_lane_allocator_test 覆盖 allocate/freeLanes/rescale/delay/extend/ensureFreeAt/车道数变化，全部通过。","result":"passed"},{"id":"A4","reason":"变速时 `startTick = tick-(tick-startTick)*(old/new)` 使 x=from-(tick-startTick)*speed 连续；`DanmakuLaneAllocator.setLayout` 先按 previous.speed/next.speed rescale 车道剩余等待，再在 width 变窄时 delay((oldW-newW)/speed)，数学上正好等于新右边缘的尾部清出时间；engine pause 冻结 Ticker 并保留 `_lastTick`，resume 后 elapsed 从 0 续算，位置与时间连续。测试「变速后位置连续，暂停不改写起点」与「变窄延迟所有忙碌车道」通过。","result":"passed"},{"id":"A5","reason":"imageKey 覆盖 text、色值、fontSize、fontWeight、fontFamily、strokeWidth、DPR、selfSend、count、mergeCount、isColorful，二次生成同样式直接返回缓存 entry，不再 layout；refs>0 的条目 evict 时跳过；样式/DPR 变化路径都先 `_clearDanmakus()`（释放引用并清空在屏条目）再 `_cache.clear()`（dispose 位图），Dispose/didChangeDependencies 同样顺序，无 use-after-dispose；预算 24MiB/512 条，稳态在屏引用数受车道数限制。位图缓存单测（命中、引用不淘汰、clear）通过。","result":"passed"},{"id":"A6","reason":"三个 painter 都通过 super(repaint: tickListenable) 绑定 `_frameNotifier`，`_tickFrame` 只写 `_frameNotifier.value`，不 setState；build 里没有对 tick 的 ValueListenableBuilder，tick 变化只触发 paint。位置由 `item.xAt(tick)` 纯函数给出，同 tick 重复绘制结果一致。测试在 60 帧后对 ScrollDanmakuPainter 的 CustomPaint widget 做 identical 断言并通过，说明未重建 widget/painter。","result":"passed"},{"id":"A7","reason":"平台侧已独立复核：canvas_danmaku、simple_live_app、simple_live_tv_app 的 `flutter analyze lib` 均 No issues；Release 产物 data/app.so(13:27)、simple_live_app.exe(13:31) 晚于全部 lib 改动；电视端 DanmakuOption/调用点未变