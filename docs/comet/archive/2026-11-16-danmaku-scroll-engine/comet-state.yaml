alse},"result":"passed","source":"brief.md","text":"连续性与重排：修改滚动速度时在屏弹幕位置不跳变，车道剩余等待按旧/新速度比例缩放；视口变窄时按丢失宽度延迟车道；暂停/恢复后位置与时间连续。"},{"id":"A5","reason":{"text":"缓存键覆盖文本/颜色/字号/字重/字体/描边/DPR/selfSend/count/mergeCount/isColorful；refs>0 不淘汰；24MiB/512 条；样式/DPR 变化先清条目再 clear，无 use-after-dispose。","truncated":false},"result":"passed","source":"brief.md","text":"位图缓存与所有权：相同文本+样式第二次生成命中缓存且不重复排版，不同样式不串图；淘汰不释放仍在屏的图；改字号/字重/字体/描边/DPR 清空缓存且无 use-after-dispose；稳态缓存不超过 24 MiB。"},{"id":"A6","reason":{"text":"painter 以 `ValueNotifier<int>` 作为 super(repaint:)，tick 只写 notifier 不 setState；60 帧 same CustomPaint identical 断言通过；位置为帧时间纯函数。","truncated":false},"result":"passed","source":"brief.md","text":"每帧重绘不重建 widget：连续 60 帧只触发 painter 重绘，不重建 CustomPaint、不新建 painter 实例。"},{"id":"A7","reason":{"text":"独立执行三包 dart analyze 全部 No issues；Release app.so 时间晚于本轮源码；字号/字重/字体/描边/区域/速度/不透明度/边距/合并开关/hideX/safeArea/清屏/切后台均接线；TV 调用点未变可编译。","truncated":false},"result":"passed","source":"brief.md","text":"设置与平台回归：字号、字重、字体、描边、区域、速度、不透明度、上下边距、合并开关、顶部/底部/特效弹幕、清屏、切后台行为与改动前等价；`simple_live_app` 与 `simple_live_tv_app` 分析通过，Windows release 构建成功。"},{"id":"A8","reason":{"text":"ShieldPatternCache 仅在 listEquals 变化时编译；FrameCoalescer 同帧去重；测试断言列表不变 rebuilds 不增、10 次 schedule 只 run 1 次。","truncated":false},"result":"passed","source":"brief.md","text":"应用侧洪峰开销：屏蔽关键词列表不变时，处理单条消息不新建 RegExp；聊天自动滚动每帧最多执行一次；对应计数测试通过。"},{"id":"A9","reason":{"text":"image budget=maxSpawnPerFrame 覆盖滚动/静态/特效/refit；单帧合并重建测试以 cacheMisses 增量≤8 验证；profile 2480 帧、UI p95 600µs、Raster p95 1101µs、超 16.7ms 为 0，spawned+dropped+merged 与注入量自洽；帧产出约 41fps 属环境限制（用户已同意合成负载）。","truncated":false},"result":"passed","source":"brief.md","text":"帧预算与观感：合成负载下每帧排版/光栅化次数不超过 `maxSpawnPerFrame`；Windows profile 密集房间 60s 的 FrameTiming 摘要显示 UI p95 ≤ 8ms 且无 >16.7ms 的 UI/Raster 帧。"},{"id":"A10","reason":{"text":"DanmakuMergeProcessor.reset 保留单调 _sequence，mergeChanged 清 merge/pendingMergeCounts/pendingRefits；新组 id 不会命中旧条目；refit 不动 startTick/from，按 extra-gapBefore 精确右移后继并 extend 车道；同帧同文本经