es/rescale/delay/extend/ensureFreeAt/车道数变化，全部通过。","result":"passed"},{"id":"A4","reason":"变速时 `startTick = tick-(tick-startTick)*(old/new)` 使 x=from-(tick-startTick)*speed 连续；`DanmakuLaneAllocator.setLayout` 先按 previous.speed/next.speed rescale 车道剩余等待，再在 width 变窄时 delay((oldW-newW)/speed)，数学上正好等于新右边缘的尾部清出时间；engine pause 冻结 Ticker 并保留 `_lastTick`，resume 后 elapsed 从 0 续算，位置与时间连续。测试「变速后位置连续，暂停不改写起点」与「变窄延迟所有忙碌车道」通过。","result":"passed"},{"id":"A5","reason":"imageKey 覆盖 text、色值、fontSize、fontWeight、fontFamily、strokeWidth、DPR、selfSend、count、mergeCount、isColorful，二次生成同样式直接返回缓存 entry，不再 layout；refs>0 的条目 evict 时跳过；样式/DPR 变化路径都先 `_clearDanmakus()`（释放引用并清空在屏条目）再 `_cache.clear()`（dispose 位图），Dispose/didChangeDependencies 同样顺序，无 use-after-dispose；预算 24MiB/512 条，稳态在屏引用数受车道数限制。位图缓存单测（命中、引用不淘汰、clear）通过。","result":"passed"},{"id":"A6","reason":"三个 painter 都通过 super(repaint: tickListenable) 绑定 `_frameNotifier`，`_tickFrame` 只写 `_frameNotifier.value`，不 setState；build 里没有对 tick 的 ValueListenableBuilder，tick 变化只触发 paint。位置由 `item.xAt(tick)` 纯函数给出，同 tick 重复绘制结果一致。测试在 60 帧后对 ScrollDanmakuPainter 的 CustomPaint widget 做 identical 断言并通过，说明未重建 widget/painter。","result":"passed"},{"id":"A7","reason":"平台侧已独立复核：canvas_danmaku、simple_live_app、simple_live_tv_app 的 `flutter analyze lib` 均 No issues；Release 产物 data/app.so(13:27)、simple_live_app.exe(13:31) 晚于全部 lib 改动；电视端 DanmakuOption/调用点未变。但旧 `_addDanmaku` 对 bottom 类型执行 safeArea 判断 `if (safeArea && yPosition <= _danmakuHeight) return false`（跳过最底两条轨道给字幕留位），新的 `_spawnStatic`（danmaku_screen.dart:385）只按 occupied 找槽，完全没有该判断；safeArea 默认 true 且两个 App 都不覆盖它，底部弹幕因此会贴到屏幕底边并占用旧实现保留的轨道，与 A7「顶部/底部…与改动前等价」以及 spec「safeArea 规则保持不变」不符。","result":"failed"},{"id":"A8","reason":"ShieldPatternCache.resolve 只在 listEquals 变化时调用 compile，处理单条消息只做 contains 匹配，不再构造 RegExp（live_room_controller 的 `_compiledShieldPatterns`）；聊天滚动改为 FrameCoalescer.schedule，_scheduled 置位到 post-frame 回调执行前，同帧多次请求只跑一次。两个测试文件内容与实现一致。","result":"passed"},{"id":"A9","reason":"D:/DEV/_research/danmaku_pro